# Tuning sensorless homing's stall threshold, SGTHRS, as klipper's docs/TMC_Drivers.md describes
# ("Find highest sensitivity that successfully homes", "Find lowest sensitivity that homes with
# one touch"), for each of the two passes (probe/beaconContact.conf). The higher SGTHRS, the more
# sensitive. It depends on the speed and the current, so each pass has its own.
#
# Before the first run, M84. Push both carriages by hand to between the middle and the home end of
# their rails (X and Y minimum), then bunny_tune_sensorless AXIS=X PASS=1 SGTHRS=<value>. A hand on
# the emergency stop. Each run ends with X and Y off and nothing homed, so the carriages are pushed
# by hand again before the next.
# A run whose G28 fails ends at the error: after klipper's "No trigger ... after full movement"
# every motor is off, Z included, so the next run hops again; after a refused travel X and Y stay
# on with nothing homed and the carriage near its endstop, where the next run can start.
# - PASS=1 homes the first pass alone, at homing_speed. It passes when the carriage travels all the
#   way to the end of its rail and stops there with one touch.
# - PASS=2 homes both passes, the first with its value as it stands, so tune the first pass first.
#   PASS=2's values are also those of X homed again after Y, which is the second pass alone. The
#   Beacon fork reports the second pass's travel, and refuses it beyond secondPassTolerance from
#   secondPassRetract ([beacon] in probe/beaconContact.conf): a value too sensitive stops at once.
# On pass 1 a value too low doesn't stop at the end and bangs into it: stop it with the emergency
# stop. On pass 2 klipper stops it after secondPassRetract + secondPassTolerance and turns the
# motors off. A range between maximum and minimum below 5 homes unreliably (TMC_Drivers.md).
# The highest value that passes is the maximum sensitivity, the lowest the minimum. The pass's value
# is then the minimum + (maximum - minimum) / 3, written into _bunny_sensorless_begin's variables.
# A tried value stays in effect until klipper restarts.

[gcode_macro bunny_tune_sensorless]
description: Home X or Y once with a trial SGTHRS for one pass, from carriages placed by hand, to tune sensorless homing
gcode:
  {% set axis = params.AXIS|default("")|lower %}
  {% set homingPass = params.PASS|default(0)|int %}
  {% set threshold = params.SGTHRS|default(-1)|int %}
  {% set homedAxes = printer.toolhead.homed_axes %}
  {% if axis not in ["x", "y"] %}
    { action_raise_error("bunny_tune_sensorless: AXIS must be X or Y. Nothing moved") }
  {% endif %}
  {% if homingPass not in [1, 2] %}
    { action_raise_error("bunny_tune_sensorless: PASS must be 1 or 2. Nothing moved") }
  {% endif %}
  {% if threshold < 0 or threshold > 255 %}
    { action_raise_error("bunny_tune_sensorless: SGTHRS must be 0 to 255, the higher the more sensitive. Nothing moved") }
  {% endif %}
  {% if printer.print_stats.state in ["printing", "paused"] %}
    { action_raise_error("bunny_tune_sensorless: a print is %s. Nothing moved" % printer.print_stats.state) }
  {% endif %}
  # A carriage homed with an untuned value may be far from where klipper thinks it is, and the
  # homing moves it to the bed centre afterwards: from the far half of a rail that would crash it.
  {% if "x" in homedAxes or "y" in homedAxes %}
    { action_raise_error("bunny_tune_sensorless: run M84, then push both carriages by hand to between the middle and the home end of their rails (X and Y minimum). Nothing moved") }
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_bunny_sensorless_begin VARIABLE={axis}_pass_{homingPass}_sgthrs VALUE={threshold}
  G28 {axis|upper} SECOND_PASS={homingPass - 1}
  RESPOND MSG="{"bunny_tune_sensorless: SGTHRS %d for %s's pass %d. Pass 1 passes if the carriage travelled all the way to the end of its rail and stopped with one touch. Pass 2 passes if the second pass's travel was accepted" % (threshold, axis|upper, homingPass)}"
  SET_KINEMATIC_POSITION CLEAR_HOMED=XYZ ; nothing is trusted after a trial value. SET_HOMED's default marks all three first, so Z is cleared too; nothing moves
  SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
  SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0 ; Z stays on at its step count, so the next run skips the blind hop
