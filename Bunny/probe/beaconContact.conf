[include beaconShared.conf]

[beacon]
home_xy_position: 101.7, 98.5 # (208.0 - 4.6) / 2.0 + 0.0, (202.0 - 5.0) / 2.0 + 0.0
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300
home_method: contact
home_method_when_homed: contact
home_autocalibrate: unhomed
homeXYCenter: 101.7, 98.5 # the bed centre, (208.0 - 4.6) / 2.0, (202.0 - 5.0) / 2.0
homeXAgain: True
# Sensorless X and Y home in two passes (the Beacon fork's homeSecondPass): the first at the
# rail's homing_speed (homing.conf), a retract of secondPassRetract, the second pass's hook, the
# pause, then the second at secondPassSpeed, its travel checked against the retract. X homed again
# after Y is the second pass alone, from secondPassRetract off its endstop.
homeSecondPass: True
secondPassRetract: 10
secondPassSpeed: 10
secondPassPause: 2
secondPassTolerance: 2
home_gcode_pre_x: _bunny_sensorless_begin AXIS=X PASS=1
homeGcodeSecondPassX: _bunny_sensorless_begin AXIS=X PASS=2
home_gcode_post_x: _bunny_sensorless_end
home_gcode_pre_y: _bunny_sensorless_begin AXIS=Y PASS=1
homeGcodeSecondPassY: _bunny_sensorless_begin AXIS=Y PASS=2
home_gcode_post_y: _bunny_sensorless_end

[gcode_macro _bunny_sensorless_begin]
description: Set the X and Y currents, the homing stepper's SGTHRS and the acceleration for one pass of a sensorless homing
# Each pass's current, for both X and Y steppers (CoreXY: both motors drive either axis), and the
# stall threshold of the axis's own stepper. SGTHRS depends on the speed and the current, so each
# pass has its own, tuned with bunny_tune_sensorless (sensorlessTuning.conf). The second pass's
# values start as the first's, tuned at 50 mm/s, and need tuning at 10 mm/s.
variable_x_pass_1_current: 0.6
variable_x_pass_1_sgthrs: 55
variable_x_pass_2_current: 0.6
variable_x_pass_2_sgthrs: 55
variable_y_pass_1_current: 0.6
variable_y_pass_1_sgthrs: 62
variable_y_pass_2_current: 0.6
variable_y_pass_2_sgthrs: 62
gcode:
	{% set axis = params.AXIS|default("")|lower %}
	{% set homingPass = params.PASS|default(0)|int %}
	{% if axis not in ["x", "y"] %}
		{ action_raise_error("_bunny_sensorless_begin: AXIS must be X or Y, not '%s'. The homing stops before this pass" % params.AXIS|default("")) }
	{% endif %}
	{% if homingPass not in [1, 2] %}
		{ action_raise_error("_bunny_sensorless_begin: PASS must be 1 or 2, not '%s'. The homing stops before this pass" % params.PASS|default("")) }
	{% endif %}
	{% set settings = printer["gcode_macro _bunny_sensorless_begin"] %}
	{% set current = settings[axis ~ "_pass_" ~ homingPass ~ "_current"] %}
	{% set threshold = settings[axis ~ "_pass_" ~ homingPass ~ "_sgthrs"] %}
	M204 S1000
	SET_TMC_CURRENT STEPPER=stepper_x CURRENT={current}
	SET_TMC_CURRENT STEPPER=stepper_y CURRENT={current}
	SET_TMC_FIELD STEPPER=stepper_{axis} FIELD=SGTHRS VALUE={threshold}
	G4 P300

[gcode_macro _bunny_sensorless_end]
description: Restore the X and Y run currents and the acceleration
gcode:
	SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer.configfile.config["tmc2209 stepper_x"].run_current}
	SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer.configfile.config["tmc2209 stepper_y"].run_current}
	G4 P300
	M204 S{printer.configfile.config.printer.max_accel}
