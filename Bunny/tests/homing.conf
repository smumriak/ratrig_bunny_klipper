# D1, "homing in two passes" (BunnyFirmware Documentation/roadmap.md): a G28 whose X and Y home in
# two passes, then each axis's second-pass travel in that G28 (printer.beacon's secondPassTravel)
# against home_second_pass_retract within home_second_pass_tolerance ([beacon] in
# probe/beaconContact.conf), and the three axes homed. The Beacon fork already refuses a travel
# outside the tolerance, so a G28 that raises is a FAIL too. The head ends where G28 leaves it. A
# hand on the emergency stop.

[gcode_macro TEST_HOMING]
description: D1: home all axes in two passes and check each second pass's travel
gcode:
  {% set printState = printer.print_stats.state %}
  {% if printState in ["printing", "paused"] or printer.idle_timeout.state == "Printing" %}
    { action_raise_error("TEST_HOMING: the printer is busy (print_stats %s, idle_timeout %s). Run it when idle. Nothing moved" % (printState, printer.idle_timeout.state)) }
  {% endif %}
  G28
  _test_homing_report

[gcode_macro _test_homing_report]
description: TEST_HOMING's checks, a macro of their own so that they render after its G28
gcode:
  {% set beaconSettings = printer.configfile.settings.beacon %}
  {% set retract = beaconSettings.home_second_pass_retract %}
  {% set tolerance = beaconSettings.home_second_pass_tolerance %}
  {% set travel = printer.beacon.secondPassTravel %}
  {% set homedAxes = printer.toolhead.homed_axes %}
  {% set result = namespace(failed=0, checks=0) %}
  {% for axis in ["x", "y"] %}
    {% set result.checks = result.checks + 1 %}
    {% if travel[axis] is none %}
      {% set result.failed = result.failed + 1 %}
      { action_respond_info("TEST_HOMING: FAIL %s had no second pass, expected %.2f mm within %.2f" % (axis|upper, retract, tolerance)) }
    {% elif (travel[axis] - retract)|abs <= tolerance %}
      { action_respond_info("TEST_HOMING: PASS %s's second pass travelled %.2f mm, expected %.2f mm within %.2f" % (axis|upper, travel[axis], retract, tolerance)) }
    {% else %}
      {% set result.failed = result.failed + 1 %}
      { action_respond_info("TEST_HOMING: FAIL %s's second pass travelled %.2f mm, expected %.2f mm within %.2f" % (axis|upper, travel[axis], retract, tolerance)) }
    {% endif %}
  {% endfor %}
  {% for axis in ["x", "y", "z"] %}
    {% set result.checks = result.checks + 1 %}
    {% if axis in homedAxes %}
      { action_respond_info("TEST_HOMING: PASS %s is homed" % (axis|upper)) }
    {% else %}
      {% set result.failed = result.failed + 1 %}
      { action_respond_info("TEST_HOMING: FAIL %s isn't homed" % (axis|upper)) }
    {% endif %}
  {% endfor %}
  {% if result.failed > 0 %}
    { action_raise_error("TEST_HOMING: FAIL, %d of %d checks failed (above)" % (result.failed, result.checks)) }
  {% endif %}
  { action_respond_info("TEST_HOMING: PASS, all %d checks" % (result.checks)) }
