# Scrubbing the nozzle tip clean before the touch, after Bambu's start G-code: the nozzle
# softens its ooze hot, is brushed by the wiper (b_wipe, wiping.conf), then cools to the touch
# temperature while it is dragged slowly across a strip of the bed outside the print area, so
# nothing can ooze back onto the tip.

[gcode_macro bunny_scrub_nozzle]
description: Scrub the nozzle on the scrub strip while it cools to the touch temperature
# The scrub strip, in nozzle coordinates, outside the print area: {'xMin': ..., 'xMax': ..., 'y': ...}.
# The strokes run from xMin to xMax at y - 1.5 to y + 1.5. Beacon measures the strip under its
# coil, which sits y_offset (17 mm) further along +Y than the nozzle, so the nozzle measures from
# y - 17, and that must be inside the Y travel. The coil must be over the sheet there too.
# None until the strip is chosen on the printer: the macro then reports and skips.
variable_strip: None
# hotOffset: added to the print temperature for the hot phase, as Bambu does (-20).
# touchTemperature: what the nozzle cools to while scrubbing, the touch temperature.
# pressDepth: how far below the measured strip the nozzle scrubs, in mm. At most 0.2.
# strokeSpeed: the scrub strokes' speed, in mm/s (Bambu's F211 is 3.5 mm/s).
variable_settings: {'hotOffset': -20, 'touchTemperature': 150, 'pressDepth': 0.0, 'strokeSpeed': 3.5}
# The strip's heights under the coil at xMin, its centre and xMax, recorded by _bunny_scrub_nozzle_measure.
variable_heights: []
gcode:
  {% if strip is none %}
    RESPOND MSG="bunny_scrub_nozzle: no scrub strip is configured, skipped"
  {% elif printer.beacon.model is none %}
    RESPOND MSG="bunny_scrub_nozzle: Beacon has no model for a contactless homing, skipped"
  {% else %}
    {% set extruderTemperature = params.EXTRUDER_TEMP|float %}
    {% set beaconSettings = printer.configfile.settings.beacon %}
    {% set minimum = printer.toolhead.axis_minimum %}
    {% set maximum = printer.toolhead.axis_maximum %}
    {% set probingY = strip.y - beaconSettings.y_offset %}
    {% if settings.pressDepth > 0.2 %}
      { action_raise_error("bunny_scrub_nozzle: pressDepth %.2f is above 0.2 mm. Nothing moved" % settings.pressDepth) }
    {% endif %}
    {% if strip.xMin >= strip.xMax or strip.xMin < minimum.x or strip.xMax > maximum.x or strip.y - 1.5 < minimum.y or strip.y + 1.5 > maximum.y %}
      { action_raise_error("bunny_scrub_nozzle: the strokes from X%.1f to X%.1f, Y%.1f to Y%.1f, leave the travel. Nothing moved" % (strip.xMin, strip.xMax, strip.y - 1.5, strip.y + 1.5)) }
    {% endif %}
    {% if probingY < minimum.y or strip.xMin - beaconSettings.x_offset < minimum.x or strip.xMax - beaconSettings.x_offset > maximum.x %}
      { action_raise_error("bunny_scrub_nozzle: Beacon can't reach the strip at Y%.1f, its coil is %.1f mm further along +Y than the nozzle. Nothing moved" % (strip.y, beaconSettings.y_offset)) }
    {% endif %}
    SAVE_GCODE_STATE NAME=bunny_scrub_nozzle
    G90
    BED_MESH_CLEAR ; PROBE reads the strip without the mesh, so the strokes go without it too. bunny_start_print scans a new one
    SET_GCODE_OFFSET Z=0 MOVE=0 ; nor with a G-code Z offset. RESTORE_GCODE_STATE puts it back
    SET_GCODE_VARIABLE MACRO=bunny_scrub_nozzle VARIABLE=heights VALUE=[]
    G28 Z METHOD=PROXIMITY ; rough Z, without touching with a dirty nozzle, before it is hot enough to ooze
    {% for probedX in [strip.xMin, (strip.xMin + strip.xMax) / 2, strip.xMax] %}
      G0 X{probedX - beaconSettings.x_offset} Y{probingY} F18000
      PROBE PROBE_METHOD=proximity ; the strip's own height under the coil, at both ends and the centre: the bed may not be tilted level yet
      _bunny_scrub_nozzle_measure
    {% endfor %}
    G0 X{strip.xMin} Y{strip.y} F18000 ; over the strip, so that the ooze lands on it
    M109 S{extruderTemperature + settings.hotOffset} ; soften the ooze
    b_wipe ; brush the softened ooze off, as Bambu's wipe does before its scrub
    _bunny_scrub_nozzle_strokes
    RESTORE_GCODE_STATE NAME=bunny_scrub_nozzle
  {% endif %}

[gcode_macro _bunny_scrub_nozzle_measure]
description: Record the strip's height from the PROBE before it, and lift the nozzle off the bed
gcode:
  {% set heights = printer["gcode_macro bunny_scrub_nozzle"].heights + [printer.beacon.last_z_result] %}
  SET_GCODE_VARIABLE MACRO=bunny_scrub_nozzle VARIABLE=heights VALUE="{heights}"
  G0 Z{printer.beacon.last_z_result + 5} F1200

[gcode_macro _bunny_scrub_nozzle_strokes]
description: The strokes of bunny_scrub_nozzle, a macro of their own so that they read the measured heights
gcode:
  {% set scrub = printer["gcode_macro bunny_scrub_nozzle"] %}
  {% set strip = scrub.strip %}
  {% set settings = scrub.settings %}
  {% set stripZ = scrub.heights|max - settings.pressDepth %}
  {% set liftedZ = stripZ + 0.5 %}
  {% set strokeFeed = settings.strokeSpeed * 60 %}
  {% set centerX = (strip.xMin + strip.xMax) / 2 %}
  {% set circlePoints = [[-0.433, 0.25], [-0.25, 0.433], [0.0, 0.5], [0.25, 0.433], [0.433, 0.25], [0.5, 0.0], [0.433, -0.25], [0.25, -0.433], [0.0, -0.5], [-0.25, -0.433], [-0.433, -0.25], [-0.5, 0.0]] %}
  G0 X{strip.xMin} Y{strip.y - 1.5} F18000
  G0 Z{liftedZ} F1200
  M104 S{settings.touchTemperature} ; cool while scrubbing
  M106 S255
  {% for lineOffset in [-1.5, 1.5, -1.0, 1.0, -0.5, 0.5, 0.0] %}
    G0 X{strip.xMin} Y{strip.y + lineOffset} Z{liftedZ} F18000
    G0 Z{stripZ} F600
    G0 X{strip.xMax} F{strokeFeed}
    G0 X{strip.xMin} F{strokeFeed}
    G0 Z{liftedZ} F1200
  {% endfor %}
  G0 X{centerX - 0.5} Y{strip.y} F18000
  G0 Z{stripZ} F600
  {% for lap in range(4) %}
    {% for point in circlePoints %}
      G0 X{centerX + point[0]} Y{strip.y + point[1]} F300
    {% endfor %}
  {% endfor %}
  M109 S{settings.touchTemperature}
  {% for lap in range(4) %}
    {% for point in circlePoints %}
      G0 X{centerX + point[0]} Y{strip.y + point[1]} F3000
    {% endfor %}
  {% endfor %}
  M107
  G0 Z{liftedZ + 4.5} F1200
