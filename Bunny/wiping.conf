# FILAMENT WIPER SERVO 
[servo filament_wiper_servo]
pin: PA15
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 169

[gcode_macro b_wipe]
variable_safe_z: 20
variable_box_x: 193
variable_box_y: 163
variable_box_width: 7
variable_box_height: 36
variable_travel_speed: 400
variable_travel_z_speed: 50
variable_wiping_speed: 400
variable_x_step: 0.5

gcode:
  {% set skipZCheck = params.SKIP_Z_CHECK|default("false")|lower %}
  {% set retract = params.RETRACT|default("false")|lower %}
  {% set stepsCount = (box_width / x_step)|int %}
  save_gcode_state name=b_wipe_z
  
  set_servo servo=filament_wiper_servo angle=169
  g4 p500
  set_servo servo=filament_wiper_servo width=0
  
  # z check
  {% if skipZCcheck != "true" %}
    # {% set x_homed = 'x' in printer.toolhead.homed_axes %}
    # {% set y_homed = 'y' in printer.toolhead.homed_axes %}
    # {% set z_homed = 'z' in printer.toolhead.homed_axes %}
  
    {% if printer.toolhead.position.z|int < safe_z %}
      g90
      g0 Z{safe_z} f{travel_z_speed * 60}
    {% endif %}
  {% endif %}

  save_gcode_state name=b_wipe_main

  g90

  g0 x{box_x + box_width} y{box_y + box_height + 2} f{travel_speed * 60}
  
  set_servo servo=filament_wiper_servo angle=99.5
  g4 p500

  g0 y{box_y + box_height} f{travel_speed * 60}
  
  # wipe motion

  {% for i in range(0, stepsCount - 1) %}
    {% set x = box_x + box_width - i * x_step %}
    g0 y{box_y} f12000
    g0 x{x - x_step} y{box_y + box_height} f{wiping_speed * 60}
  {% endfor %}

  # {% for i in range(0, stepsCount - 1) %}
  #   {% set x = box_x + i * x_step %}
  #   g0 y{box_y} f12000
  #   g0 x{x + x_step} y{box_y + box_height} f{wiping_speed * 60}
  # {% endfor %}

  g0 y{box_y + box_height + 2} f{travel_speed * 60}

  set_servo servo=filament_wiper_servo angle=169
  g4 p500
  set_servo servo=filament_wiper_servo width=0

  g92 e0
  
  restore_gcode_state name=b_wipe_main move=1 move_speed={travel_speed}
  restore_gcode_state name=b_wipe_z move=1 move_speed={travel_z_speed}

